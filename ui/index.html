<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>Claude Linux</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  color-scheme:dark;
  --bg:#262624; --side:#1f1e1d; --card:#30302e; --card2:#383835; --fg:#faf9f5; --dim:#a8a59c; --faint:#3f3e3a; --line:#34332f;
  --input:#30302e; --codebg:#1b1b19; --strong:#fff; --hover:rgba(255,255,255,.055); --accent:#d97757; --accent2:#c6613f;
  --green:#5fbf79; --red:#f0707f; --yellow:#e6c07b; --shadow:0 10px 40px rgba(0,0,0,.45);
  --sans:"Inter","Segoe UI","Cantarell","Noto Sans",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","Fira Code","DejaVu Sans Mono",monospace;
  --sp:1; --onacc:#fff; --fs:15px; --cw:800px; --ga:.82; --sa:.78; --blur:18px;
  --sc:var(--dim); --ss:var(--green); --sn:var(--yellow); --sk:var(--accent);
  --sf:color-mix(in srgb,var(--accent) 55%,var(--fg)); --st:color-mix(in srgb,var(--yellow) 70%,var(--red)); --sv:color-mix(in srgb,var(--green) 60%,var(--fg));
}
[data-theme=light] {
  --bg:#faf9f5; --side:#f0eee6; --card:#ffffff; --card2:#f4f2ea; --fg:#29261f; --dim:#77736a; --faint:#dcd8cb; --line:#e6e2d6;
  --input:#ffffff; --codebg:#f2efe6; --strong:#000; --hover:rgba(0,0,0,.05); --shadow:0 10px 40px rgba(60,50,30,.18);
  --green:#1f8a3b; --red:#c62d45; --yellow:#8a5a00; color-scheme:light;
}
[data-theme=sepia] { --bg:#f4ecd8; --side:#ebe1c9; --card:#fbf6e9; --card2:#efe5cc; --fg:#433422; --dim:#85704f; --faint:#d8c9a6; --line:#e2d5b6; --input:#fbf6e9; --codebg:#efe5cc; --strong:#201608; --hover:rgba(67,52,34,.07); --accent:#b4552d; --shadow:0 10px 40px rgba(80,60,20,.2); --green:#4a7a2a; --red:#b3362b; --yellow:#8a5a00; color-scheme:light; }
[data-theme=midnight] { --bg:#0f1420; --side:#0b0f19; --card:#171d2c; --card2:#1f2740; --fg:#e6ecff; --dim:#8f9bbd; --faint:#2b3550; --line:#222b42; --input:#171d2c; --codebg:#0a0e18; --accent:#6ea8fe; --shadow:0 10px 40px rgba(0,0,0,.6); }

[data-theme=dracula] { --bg:#282a36; --side:#21222c; --card:#343746; --card2:#44475a; --fg:#f8f8f2; --dim:#a4acd0; --faint:#4b4f66; --line:#3a3d4f; --input:#343746; --codebg:#1e1f29; --accent:#bd93f9; --green:#50fa7b; --red:#ff5555; --yellow:#f1fa8c; }
[data-theme=solarized] { --bg:#002b36; --side:#00232c; --card:#073642; --card2:#0d4553; --fg:#eee8d5; --dim:#93a1a1; --faint:#1c5563; --line:#0b3d4b; --input:#073642; --codebg:#00212b; --accent:#cb4b16; --green:#859900; --red:#dc322f; --yellow:#b58900; }
[data-theme=gruvbox] { --bg:#282828; --side:#1d2021; --card:#3c3836; --card2:#504945; --fg:#ebdbb2; --dim:#a89984; --faint:#504945; --line:#45403d; --input:#3c3836; --codebg:#1b1b1b; --accent:#fe8019; --green:#b8bb26; --red:#fb4934; --yellow:#fabd2f; }
[data-theme=rosepine] { --bg:#191724; --side:#14121f; --card:#26233a; --card2:#2a2740; --fg:#e0def4; --dim:#9893b5; --faint:#403d52; --line:#2a2740; --input:#26233a; --codebg:#12101c; --accent:#eb6f92; --green:#9ccfd8; --red:#eb6f92; --yellow:#f6c177; }
[data-theme=terminal] { --bg:#0c0c0c; --side:#080808; --card:#161616; --card2:#1f1f1f; --fg:#d4d4d4; --dim:#808080; --faint:#333; --line:#222; --input:#121212; --codebg:#060606; --strong:#fff; --sans:var(--mono); }
[data-theme=contrast] { --bg:#000; --side:#000; --card:#0d0d0d; --card2:#1a1a1a; --fg:#fff; --dim:#cfcfcf; --faint:#777; --line:#555; --input:#000; --codebg:#000; --strong:#fff; --accent:#ffb000; --green:#3cff7a; --red:#ff5c5c; --yellow:#ffe14d; --hover:rgba(255,255,255,.12); }

/* more palettes */
[data-theme=catppuccin-mocha] { --bg:#1e1e2e; --side:#181825; --card:#313244; --card2:#45475a; --fg:#cdd6f4; --dim:#a6adc8; --faint:#45475a; --line:#313244; --input:#313244; --codebg:#11111b; --accent:#cba6f7; --green:#a6e3a1; --red:#f38ba8; --yellow:#f9e2af; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=catppuccin-macchiato] { --bg:#24273a; --side:#1e2030; --card:#363a4f; --card2:#494d64; --fg:#cad3f5; --dim:#a5adcb; --faint:#494d64; --line:#363a4f; --input:#363a4f; --codebg:#181926; --accent:#c6a0f6; --green:#a6da95; --red:#ed8796; --yellow:#eed49f; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=catppuccin-latte] { --bg:#eff1f5; --side:#e6e9ef; --card:#ffffff; --card2:#e6e9ef; --fg:#4c4f69; --dim:#6c6f85; --faint:#ccd0da; --line:#dce0e8; --input:#ffffff; --codebg:#e6e9ef; --accent:#8839ef; --green:#40a02b; --red:#d20f39; --yellow:#b86e0a; --hover:rgba(0,0,0,.05); --shadow:0 10px 40px rgba(60,50,30,.18); --strong:#000; color-scheme:light; }
[data-theme=tokyonight] { --bg:#1a1b26; --side:#16161e; --card:#24283b; --card2:#2f334d; --fg:#c0caf5; --dim:#8d96c0; --faint:#3b4261; --line:#292e42; --input:#24283b; --codebg:#13141c; --accent:#7aa2f7; --green:#9ece6a; --red:#f7768e; --yellow:#e0af68; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=onedark] { --bg:#282c34; --side:#21252b; --card:#2c313a; --card2:#333842; --fg:#abb2bf; --dim:#8b919d; --faint:#3e4451; --line:#353b45; --input:#2c313a; --codebg:#1e2227; --accent:#61afef; --green:#98c379; --red:#e06c75; --yellow:#e5c07b; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=everforest] { --bg:#2d353b; --side:#232a2e; --card:#343f44; --card2:#3d484d; --fg:#d3c6aa; --dim:#9da9a0; --faint:#475258; --line:#3a464c; --input:#343f44; --codebg:#1e2326; --accent:#a7c080; --green:#a7c080; --red:#e67e80; --yellow:#dbbc7f; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=kanagawa] { --bg:#1f1f28; --side:#16161d; --card:#2a2a37; --card2:#363646; --fg:#dcd7ba; --dim:#a6a69c; --faint:#54546d; --line:#2f2f3d; --input:#2a2a37; --codebg:#181820; --accent:#7e9cd8; --green:#98bb6c; --red:#e46876; --yellow:#e6c384; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=ayu] { --bg:#1f2430; --side:#191e2a; --card:#272d3b; --card2:#323a4c; --fg:#cccac2; --dim:#9099a6; --faint:#3d4659; --line:#2a3040; --input:#272d3b; --codebg:#171b24; --accent:#ffcc66; --green:#87d96c; --red:#f28779; --yellow:#ffd173; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=monokai] { --bg:#272822; --side:#1e1f1c; --card:#34352e; --card2:#3e3d32; --fg:#f8f8f2; --dim:#b0aa8e; --faint:#49483e; --line:#3b3c35; --input:#34352e; --codebg:#1c1d19; --accent:#a6e22e; --green:#a6e22e; --red:#f92672; --yellow:#e6db74; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=cyberpunk] { --bg:#0d0221; --side:#080115; --card:#1a0b3a; --card2:#26104f; --fg:#e8f1ff; --dim:#a58fcf; --faint:#3a1f6e; --line:#2a1458; --input:#1a0b3a; --codebg:#070113; --accent:#ff2a6d; --green:#05ffa1; --red:#ff4d6d; --yellow:#f9f871; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }
[data-theme=synthwave] { --bg:#262335; --side:#1f1c2e; --card:#2f2b43; --card2:#3b3654; --fg:#ffffff; --dim:#b6b1d1; --faint:#495495; --line:#34294f; --input:#2f2b43; --codebg:#1c1928; --accent:#ff7edb; --green:#72f1b8; --red:#fe4450; --yellow:#fede5d; --hover:rgba(255,255,255,.055); --shadow:0 10px 40px rgba(0,0,0,.5); --strong:#fff; }

/* themes built from a handful of colors: "system" (Plasma's colors) and "custom" (your own). JS sets --bg --side --card --fg --dim ... inline. */
[data-theme=system], [data-theme=custom] {
  --card2:color-mix(in srgb,var(--card) 86%,var(--fg)); --faint:color-mix(in srgb,var(--bg) 80%,var(--fg)); --line:color-mix(in srgb,var(--bg) 88%,var(--fg));
  --input:var(--card); --codebg:color-mix(in srgb,var(--bg) 70%,#000); --hover:color-mix(in srgb,var(--fg) 7%,transparent); --strong:#fff;
}
html[data-scheme=light][data-theme=system], html[data-scheme=light][data-theme=custom] {
  color-scheme:light; --codebg:color-mix(in srgb,var(--bg) 94%,#000); --strong:#000; --shadow:0 10px 40px rgba(60,50,30,.18);
}

/* syntax themes (code colors), chosen in Settings > Appearance */
html[data-syntax=monokai][data-scheme=dark] { --sc:#88846f; --ss:#e6db74; --sn:#ae81ff; --sk:#f92672; --sf:#a6e22e; --st:#66d9ef; --sv:#fd971f; }
html[data-syntax=github][data-scheme=dark] { --sc:#8b949e; --ss:#a5d6ff; --sn:#79c0ff; --sk:#ff7b72; --sf:#d2a8ff; --st:#ffa657; --sv:#79c0ff; }
html[data-syntax=github][data-scheme=light] { --sc:#6e7781; --ss:#0a3069; --sn:#0550ae; --sk:#cf222e; --sf:#8250df; --st:#953800; --sv:#0550ae; }
html[data-syntax=onedark][data-scheme=dark] { --sc:#7f848e; --ss:#98c379; --sn:#d19a66; --sk:#c678dd; --sf:#61afef; --st:#e5c07b; --sv:#e06c75; }
html[data-syntax=dracula][data-scheme=dark] { --sc:#7b86b6; --ss:#f1fa8c; --sn:#bd93f9; --sk:#ff79c6; --sf:#50fa7b; --st:#8be9fd; --sv:#ffb86c; }
html[data-syntax=nord][data-scheme=dark] { --sc:#7b88a1; --ss:#a3be8c; --sn:#b48ead; --sk:#81a1c1; --sf:#88c0d0; --st:#8fbcbb; --sv:#d8dee9; }
html[data-syntax=solarized] { --sc:#7f9094; --ss:#2aa198; --sn:#d33682; --sk:#859900; --sf:#268bd2; --st:#b58900; --sv:#cb4b16; }
html[data-syntax=catppuccin][data-scheme=dark] { --sc:#7f849c; --ss:#a6e3a1; --sn:#fab387; --sk:#cba6f7; --sf:#89b4fa; --st:#f9e2af; --sv:#f5c2e7; }
html[data-syntax=catppuccin][data-scheme=light] { --sc:#7c7f93; --ss:#40a02b; --sn:#fe640b; --sk:#8839ef; --sf:#1e66f5; --st:#df8e1d; --sv:#ea76cb; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:var(--fs,15px)/1.6 var(--sans); }
button,input,select,textarea { font:inherit; color:inherit; }
svg.i { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:-3px; }
#app { display:flex; height:100%; }

/* sidebar */
#side { width:260px; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; flex:none; overflow:hidden; transition:width calc(.26s*var(--sp)) cubic-bezier(.2,.8,.2,1),opacity calc(.2s*var(--sp)),border-color calc(.2s*var(--sp)); }
#sidein { width:259px; flex:1; min-height:0; display:flex; flex-direction:column; }   /* fixed width, so collapsing the sidebar clips it instead of squeezing it */
#side.collapsed { width:0; opacity:0; border-right-width:0; pointer-events:none; }
html.notrans #side { transition:none; }
.brand { display:flex; align-items:center; gap:9px; padding:16px 16px 10px; font-weight:600; font-size:15px; }
.brand svg { width:22px; height:22px; }
#new { margin:6px 12px 8px; padding:9px 12px; display:flex; align-items:center; gap:8px; background:var(--accent); color:var(--onacc,#fff); border:0; border-radius:10px; cursor:pointer; font-weight:500; transition:filter calc(.15s*var(--sp)),transform calc(.12s*var(--sp)); }
#new:hover { filter:brightness(1.08); } #new:active { transform:scale(.98); }
#list { flex:1; overflow:auto; padding:4px 8px; }
.grp { padding:12px 10px 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
.chat { padding:7px 10px; border-radius:8px; color:var(--dim); cursor:pointer; display:flex; align-items:center; gap:6px; font-size:14px; transition:background calc(.12s*var(--sp)),color calc(.12s*var(--sp)); }
.chat:hover { background:var(--hover); color:var(--fg); }
.chat.active { background:var(--card); color:var(--fg); }
.chat .t { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.chat .x { opacity:0; border:0; background:none; cursor:pointer; color:var(--dim); padding:2px; border-radius:4px; display:flex; }
.chat:hover .x { opacity:1; } .chat .x:hover { color:var(--red); }
.chat .bz { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse calc(1s*var(--sp)) ease-in-out infinite; }
#sidefoot { border-top:1px solid var(--line); padding:8px; display:flex; flex-direction:column; gap:2px; }
.sbtn { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; border:0; background:none; cursor:pointer; color:var(--dim); text-align:left; font-size:14px; transition:background calc(.12s*var(--sp)),color calc(.12s*var(--sp)); }
.sbtn:hover { background:var(--hover); color:var(--fg); }
.sbtn .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); margin-left:auto; }

/* top bar */
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#top { display:flex; align-items:center; gap:12px; padding:10px 18px; }
#tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; }
#tabs button { border:0; background:none; padding:5px 16px; border-radius:7px; cursor:pointer; color:var(--dim); font-weight:500; transition:all calc(.18s*var(--sp)); }
#tabs button:hover { color:var(--fg); } #tabs button.on { background:var(--card2); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.3); }
#title { flex:1; text-align:center; color:var(--dim); font-size:14px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.chip { display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 12px; font-size:12.5px; color:var(--dim); cursor:pointer; transition:all calc(.15s*var(--sp)); white-space:nowrap; }
.chip:hover { border-color:var(--accent); color:var(--fg); }
.chip .g { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 7px var(--green); }
.chip .g.y { background:var(--yellow); box-shadow:0 0 7px var(--yellow); animation:pulse calc(1s*var(--sp)) infinite; }
.mini { width:34px; height:5px; border-radius:3px; background:var(--faint); overflow:hidden; display:inline-block; vertical-align:middle; }
.mini i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width calc(.6s*var(--sp)) cubic-bezier(.2,.8,.2,1); }
.mini.hi i { background:var(--red); }
.ib { border:0; background:none; cursor:pointer; color:var(--dim); border-radius:8px; padding:7px; display:flex; transition:all calc(.15s*var(--sp)); }
.ib:hover { background:var(--hover); color:var(--fg); }

/* conversation */
#scroll { flex:1; overflow:auto; }
#col { max-width:var(--cw,800px); margin:0 auto; padding:10px 24px 30px; }
.hero { text-align:center; padding:12vh 0 10px; animation:rise calc(.5s*var(--sp)) ease both; }
.hero svg { width:46px; height:46px; margin-bottom:14px; }
.hero h1 { font-size:28px; font-weight:500; margin:0 0 6px; letter-spacing:-.01em; }
.hero p { color:var(--dim); margin:0; font-size:14px; }
.msg { margin:14px 0; animation:rise calc(.28s*var(--sp)) cubic-bezier(.2,.8,.2,1) both; word-break:break-word; }
.msg.user { animation-name:riseUser; }
.user { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; white-space:pre-wrap; }
.asst { line-height:1.7; }
.asst p { margin:0 0 .8em; } .asst p:last-child { margin-bottom:0; }
.asst h1,.asst h2,.asst h3 { margin:1em 0 .4em; line-height:1.3; font-weight:600; } .asst h1 { font-size:1.35em; } .asst h2 { font-size:1.18em; } .asst h3 { font-size:1.05em; }
.asst ul,.asst ol { margin:.3em 0 .8em; padding-left:1.4em; } .asst li { margin:.15em 0; }
.asst code { font:12.5px var(--mono); background:var(--card); border:1px solid var(--line); padding:1px 6px; border-radius:5px; }
.asst a { color:var(--accent); }
.cb { background:var(--codebg); border:1px solid var(--line); border-radius:10px; margin:.7em 0; overflow:hidden; }
.cb .ch { display:flex; justify-content:space-between; padding:5px 12px; font-size:11.5px; color:var(--dim); border-bottom:1px solid var(--line); }
.cb .copy { border:0; background:none; cursor:pointer; color:var(--dim); font-size:11.5px; } .cb .copy:hover { color:var(--fg); }
.cb pre { margin:0; padding:10px 14px; overflow:auto; font:12.5px/1.55 var(--mono); } .cb pre code { background:none; border:0; padding:0; }
.msg.live:has(.tail)::after { display:none; } .msg.live .tail > :last-child::after, .msg.live::after { content:""; display:inline-block; width:8px; height:16px; background:var(--accent); border-radius:2px; vertical-align:-3px; margin-left:3px; box-shadow:0 0 8px var(--accent); animation:caret calc(1.1s*var(--sp)) ease-in-out infinite; }
.tool { border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; }
.th { display:flex; align-items:center; gap:9px; padding:7px 12px; cursor:pointer; font-size:13px; }
.th:hover { background:var(--hover); }
.th .n { font-weight:600; } .th .a { font:12px var(--mono); color:var(--dim); flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.th .chev { transition:transform calc(.2s*var(--sp)); color:var(--dim); } .tool.open .chev { transform:rotate(90deg); }
.ts { width:14px; height:14px; border-radius:50%; flex:none; display:flex; }
.tool.run .ts { border:2px solid var(--faint); border-top-color:var(--accent); animation:spin calc(.8s*var(--sp)) linear infinite; }
.tool.ok .ts { color:var(--green); } .tool.err .ts { color:var(--red); }
.tb { display:block; max-height:0; overflow:hidden; opacity:0; border-top:0 solid var(--line); padding:0 12px; font:12px/1.5 var(--mono); color:var(--dim); white-space:pre-wrap; background:var(--codebg);
  transition:max-height calc(.3s*var(--sp)) cubic-bezier(.2,.8,.2,1),opacity calc(.2s*var(--sp)),padding calc(.3s*var(--sp)),border-top-width calc(.2s*var(--sp)); }
.tool.open .tb { max-height:340px; overflow:auto; opacity:1; padding:8px 12px; border-top-width:1px; }
.tool.err .tb { color:var(--red); }
.dc { display:flex; gap:8px; font:600 12px var(--mono); margin-left:8px; } .dc em { font-style:normal; } .dc .p { color:var(--green); } .dc .m { color:var(--red); }
.tb:has(.df) { padding-left:0; padding-right:0; white-space:normal; } .tool.open .tb:has(.df) { padding-top:6px; padding-bottom:6px; }
.dr { display:flex; white-space:pre-wrap; word-break:break-all; color:var(--dim); } .dr i { width:44px; flex:none; text-align:right; padding-right:10px; opacity:.55; font-style:normal; user-select:none; } .dr b { width:16px; flex:none; font-weight:700; user-select:none; } .dr span { flex:1; min-width:0; padding-right:12px; }
.dr.add { background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--fg); } .dr.add b { color:var(--green); }
.dr.del { background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--fg); } .dr.del b { color:var(--red); }
.dr.sep { opacity:.5; } .dr.er { color:var(--red); padding:6px 12px 0; border-top:1px solid var(--line); margin-top:6px; }

.task { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; } .task .d { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; } .task .d.run { background:var(--accent); animation:pulse calc(1s*var(--sp)) ease-in-out infinite; } .task .d.ok { background:var(--green); } .task .d.bad { background:var(--red); }
.task span.tx { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .task button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:1px 8px; cursor:pointer; font-size:12px; } .task button:hover { color:var(--red); border-color:var(--red); }
.mst { font-size:12px; padding:1px 8px; border-radius:999px; background:var(--card2); white-space:nowrap; } .mst.ok { color:var(--green); } .mst.warn { color:var(--yellow); } .mst.bad { color:var(--red); }
/* ---------- motion, effects, backgrounds, split view, drop zone, new settings widgets ---------- */

/* reduced motion: everything finishes instantly (data-motion is set from the setting / the OS preference) */
html[data-motion=reduced] *, html[data-motion=reduced] *::before, html[data-motion=reduced] *::after {
  animation-duration:.001ms !important; animation-delay:0s !important; animation-iteration-count:1 !important;
  transition-duration:.001ms !important; scroll-behavior:auto !important;
}

/* theme change: colors cross-fade for a moment */
html.tfade, html.tfade *, html.tfade *::before, html.tfade *::after {
  transition:background-color calc(.4s*var(--sp)) ease,color calc(.4s*var(--sp)) ease,border-color calc(.4s*var(--sp)) ease,fill calc(.4s*var(--sp)) ease,stroke calc(.4s*var(--sp)) ease !important;
}

/* press ripples and hover lift */
.btn, #new, #sendb, .pill, .seg button, #tabs button, .opt, .ib, .tc { position:relative; overflow:hidden; }
.ripple { position:absolute; border-radius:50%; pointer-events:none; background:currentColor; opacity:.24; transform:scale(0); animation:ripple calc(.6s*var(--sp)) ease-out forwards; }
@keyframes ripple { to { transform:scale(1); opacity:0; } }
.btn:hover:not(:disabled) { transform:translateY(-1px); } .btn:active:not(:disabled) { transform:scale(.97); }
.chip:hover { transform:translateY(-1px); }

/* thinking indicator: the Claude logo breathes */
#status .st { display:inline-flex; width:16px; height:16px; }
#status .st svg { width:16px; height:16px; animation:breathe calc(1.8s*var(--sp)) ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform:scale(.82) rotate(0deg); opacity:.65; } 50% { transform:scale(1.1) rotate(90deg); opacity:1; } }

/* diff rows slide in one after the other when a card opens */
.tool.open .dr { animation:rowin calc(.34s*var(--sp)) cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--n,0)*16ms*var(--sp)); }
.tool.noanim .dr, #col.norise .dr { animation:none; }
@keyframes rowin { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:none; } }

/* finishing a long task */
#box.glow { animation:glow calc(1.4s*var(--sp)) ease-out; }
#sendb.glow { animation:glowb calc(1.4s*var(--sp)) ease-out; }
@keyframes glow { 0% { box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 65%,transparent),0 4px 24px rgba(0,0,0,.18); } 100% { box-shadow:0 0 0 26px transparent,0 4px 24px rgba(0,0,0,.18); } }
@keyframes glowb { 0% { box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 75%,transparent); } 100% { box-shadow:0 0 0 22px transparent; } }
#confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:200; }

/* background layer behind the whole app */
#app { position:relative; z-index:1; }
#bgfx { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:var(--bg); }
#bgfx::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,var(--dim,.5)); display:none; }
#bgfx.image::after, #bgfx.gradient::after { display:block; }
html[data-scheme=light] #bgfx::after { background:rgba(255,255,255,var(--dim,.5)); }
#bgfx.image { background-size:cover; background-position:center; }
#bgfx.gradient { animation:gradshift calc(40s*var(--sp)) ease-in-out infinite; }
@keyframes gradshift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
#bgfx.aurora i { position:absolute; width:62vmax; height:62vmax; border-radius:50%; filter:blur(90px); opacity:.42; will-change:transform; animation:drift calc(34s*var(--sp)) ease-in-out infinite alternate; }
#bgfx.aurora i:nth-child(1) { background:var(--accent); left:-12vmax; top:-18vmax; }
#bgfx.aurora i:nth-child(2) { background:color-mix(in srgb,var(--accent) 35%,#5b8cff); right:-16vmax; top:8vmax; animation-duration:calc(42s*var(--sp)); animation-delay:-9s; }
#bgfx.aurora i:nth-child(3) { background:color-mix(in srgb,var(--accent) 45%,#ff6ad5); left:18vmax; bottom:-26vmax; animation-duration:calc(50s*var(--sp)); animation-delay:-20s; }
@keyframes drift { from { transform:translate(0,0) scale(1); } 50% { transform:translate(7vmax,-5vmax) scale(1.18); } to { transform:translate(-6vmax,6vmax) scale(.92); } }
#bgfx canvas { position:absolute; inset:0; width:100%; height:100%; }

/* with a background, the surfaces let it show through */
html.fx, html.fx body { background:var(--bg); }
html.fx body { background:transparent; }
html.fx #side { background:color-mix(in srgb,var(--side) calc(var(--sa)*100%),transparent); -webkit-backdrop-filter:blur(var(--blur)); backdrop-filter:blur(var(--blur)); }
html.fx #main, html.fx #split { background:color-mix(in srgb,var(--bg) calc(var(--sa)*70%),transparent); }
html.fx .user, html.fx .tool, html.fx .pc, html.fx #box, html.fx .dsec, html.fx .asst code { background:color-mix(in srgb,var(--card) calc(var(--sa)*100%),transparent); }
html.fx #drawer { background:color-mix(in srgb,var(--side) calc(var(--sa)*100%),transparent); -webkit-backdrop-filter:blur(var(--blur)); backdrop-filter:blur(var(--blur)); }
html.fx .cb { background:color-mix(in srgb,var(--codebg) calc(var(--sa)*100%),transparent); }
html.fx .pop, html.fx #palbox { -webkit-backdrop-filter:blur(var(--blur)); backdrop-filter:blur(var(--blur)); }

/* a see-through window (the GTK window is made transparent too) */
html.glass, html.glass body { background:transparent; }
html.glass #side { background:color-mix(in srgb,var(--side) calc(var(--ga)*100%),transparent); }
html.glass #main, html.glass #split { background:color-mix(in srgb,var(--bg) calc(var(--ga)*100%),transparent); }
html.glass #drawer { background:color-mix(in srgb,var(--side) calc(var(--ga)*100%),transparent); }
html.glass.fx #main, html.glass.fx #split { background:color-mix(in srgb,var(--bg) calc(var(--sa)*70%),transparent); }
html.glass.fx #side { background:color-mix(in srgb,var(--side) calc(var(--sa)*100%),transparent); }
html.glass #bgfx { background:transparent; }

/* code blocks: line numbers and wrapping */
.cb pre { counter-reset:l; }
html.codenums .cb .ln::before { counter-increment:l; content:counter(l); display:inline-block; min-width:2.2em; margin-right:1em; text-align:right; color:var(--dim); opacity:.55; user-select:none; }
html.codewrap .cb pre { white-space:pre-wrap; word-break:break-word; }
.cb .ch .lang { text-transform:lowercase; }

/* sidebar */
.chat .cdot { width:8px; height:8px; border-radius:50%; flex:none; }
.chat.hasSnip { flex-wrap:wrap; row-gap:0; }
.chat .snip { order:9; flex-basis:100%; font-size:11.5px; color:var(--dim); opacity:.85; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.chat .snip mark { background:color-mix(in srgb,var(--accent) 35%,transparent); color:inherit; border-radius:3px; padding:0 1px; }
.swatches { display:flex; flex-wrap:wrap; gap:8px; padding:6px 14px 10px; }
.swc { width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; box-shadow:0 0 0 1px rgba(128,128,128,.4) inset; transition:transform calc(.12s*var(--sp)); }
.swc:hover { transform:scale(1.15); } .swc.on { border-color:var(--fg); }
.swc.none { background:linear-gradient(135deg,transparent 45%,var(--red) 46%,var(--red) 54%,transparent 55%); }

/* split view: a second chat beside the main one */
#split { flex:1; min-width:0; display:none; flex-direction:column; border-left:1px solid var(--line); background:var(--bg); }
#app.splitting #split { display:flex; } #app.splitting #main { flex:1; }
#shead { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
#shead .stt { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--dim); font-size:14px; }
#sscroll { flex:1; overflow:auto; } #scol { max-width:var(--cw,800px); margin:0 auto; padding:10px 20px 30px; }
#scol .msg { animation:none; } #scol .pc .opts { display:none; }
.sendnote { color:var(--dim); font-size:12.5px; text-align:center; padding:8px; }
@media (max-width:980px) { #app.splitting #split { display:none; } }

/* dropping files onto the window */
#dropz { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
#dropz.on { display:flex; animation:rise calc(.15s*var(--sp)) ease both; }
#dropz div { border:2px dashed var(--accent); border-radius:22px; padding:44px 70px; font-size:18px; font-weight:500; background:var(--card); color:var(--fg); text-align:center; }
#dropz small { display:block; color:var(--dim); font-size:13px; font-weight:400; margin-top:6px; }

/* settings: appearance */
.ap-row { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); } .ap-row:last-child { border-bottom:0; }
.ap-row .tx { flex:1; min-width:0; } .ap-row .tx b { font-weight:500; display:block; } .ap-row .tx small { color:var(--dim); font-size:12.5px; display:block; margin-top:1px; }
.ap-row input[type=range] { width:190px; accent-color:var(--accent); } .ap-row .val { width:52px; text-align:right; color:var(--dim); font:12.5px var(--mono); }
input[type=color] { width:38px; height:28px; padding:0; border:1px solid var(--faint); border-radius:7px; background:none; cursor:pointer; }
.cgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px 16px; padding:14px 16px; }
.cgrid label { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:var(--dim); }
.themes .tc.ad .pv { background:repeating-linear-gradient(45deg,var(--card2),var(--card2) 6px,var(--card) 6px,var(--card) 12px); }
.tgroup { margin:16px 0 8px; font-size:12px; color:var(--dim); }
.demo { margin-top:12px; }
.note { color:var(--dim); font-size:12.5px; padding:8px 16px 12px; }

/* printing / PDF export: only the document shows */
#printdoc { display:none; }
@media print {
  html, body { height:auto !important; overflow:visible !important; background:#fff !important; color:#111 !important; }
  body > *:not(#printdoc) { display:none !important; }
  #printdoc { display:block !important; }
}

#updmodal { position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); }

    else if (it.k === 'think') out.push(`<details class="t"><summary>Thinking</summary><div>${esc(it.text)}</div></details>`);
    else if (it.k === 'tool') out.push(`<div class="tl"><b>${esc(it.name)}</b> <code>${esc(String(toolArg(it.input || {})).slice(0, 200))}</code>${it.result ? `<pre>${esc(trimLines(String(it.result), 25))}</pre>` : ''}</div>`);
    else if (it.k === 'err') out.push(`<div class="e">${esc(it.text)}</div>`);
    else if (it.k === 'div') out.push(`<hr><div class="meta">${esc(it.text)}</div>`);
    else if (it.k === 'sys') out.push(`<div class="meta">${esc(it.text)}</div>`);
  }
  return out.join('\n');
}
const fullHTML = c => `<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.title)}</title>\n<style>body{margin:0;padding:28px 18px;background:#fff}${DOC_CSS}</style></head>\n<body><div class="pdoc">${chatHTML(c)}</div></body></html>\n`;
function endPrint() { for (const s of ['#printdoc', '#printstyle']) { const e = $(s); if (e) e.remove(); } }
function printChat(c) {
  endPrint();
  const st = document.createElement('style'); st.id = 'printstyle'; st.textContent = DOC_CSS; document.head.appendChild(st);
  const d = document.createElement('div'); d.id = 'printdoc'; d.className = 'pdoc'; d.innerHTML = chatHTML(c); document.body.appendChild(d);
  toast('Creating the PDF…'); post({type:'pdf', name:c.title});
}
function exportChat(fmt) {
  const c = chats[cur]; if (!c || !c.items.length) return toast('Nothing to export yet', true);
  fmt = String(fmt || 'md').trim().toLowerCase();
  if (fmt === 'md' || fmt === 'markdown') return post({type:'export', chat:cur});
  if (fmt === 'html') return post({type:'savetext', name:c.title, ext:'.html', text:fullHTML(c)});
  if (fmt === 'pdf') return printChat(c);
  toast('Use /export md, /export html or /export pdf', true);
}
EXTRA.pdf_done = p => { endPrint(); toast(p.text, !p.ok); };
/* ---------- drop files anywhere on the window: images are attached, other files become @mentions ---------- */
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].some(t => t === 'Files' || t === 'text/uri-list');
function dropPaths(dt) {
  return (dt.getData('text/uri-list') || '').split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith('file://'))
    .map(l => { try { return decodeURIComponent(new URL(l).pathname); } catch (e) { return ''; } }).filter(Boolean);
}
function mentionPaths(paths) {
  const cwd = (chats[cur] || {}).cwd || home, inp = $('#in');
  const toks = paths.map(p => { const r = p.startsWith(cwd + '/') ? p.slice(cwd.length + 1) : p; return /\s/.test(r) ? '@"' + r + '"' : '@' + r; });
  inp.value += (inp.value && !/\s$/.test(inp.value) ? ' ' : '') + toks.join(' ') + ' '; resize(); inp.focus();
  if (tab === 'chat') toast('Added the path. Chat mode cannot read files; switch to Code to let Claude open them.');
}
function handleDrop(dt) {
  const files = [...dt.files], imgs = files.filter(f => f.type.startsWith('image/')); if (imgs.length) addFiles(imgs);
  const names = new Set(imgs.map(f => f.name)), paths = dropPaths(dt).filter(p => !names.has(p.split('/').pop()));
  if (paths.length) mentionPaths(paths);
  else if (!imgs.length && files.length) toast('Could not read where that file lives. Drag it from the file manager.', true);
}
document.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#dropz').classList.add('on'); } });
document.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('#dropz').classList.remove('on'); } });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $('#dropz').classList.remove('on'); handleDrop(e.dataTransfer); });
/* ---------- more keyboard shortcuts (the first set lives in palette.js) ---------- */
function zoom(d) { setSetting('fontSize', clamp((+S.settings.fontSize || 15) + d, 11, 24)); }
function switchTab(t) { tab = t; const n = visible().find(c => c.items.length); n ? select(n.id) : newChat(); }
document.addEventListener('keydown', e => {
  if (e.key === 'F11') { e.preventDefault(); post({type:'fullscreen'}); return; }
  if (!e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key, go = f => { e.preventDefault(); e.stopPropagation(); f(); };
  if (k === '\\') go(toggleSplit);
  else if (k === '=' || k === '+') go(() => zoom(1));
  else if (k === '-' || k === '_') go(() => zoom(-1));
  else if (k === '0') go(() => setSetting('fontSize', 15));
  else if (k === 'w') go(() => post({type:'close'}));
  else if (k === 'q') go(() => post({type:'quit'}));
  else if (k === '1') go(() => switchTab('chat'));
  else if (k === '2') go(() => switchTab('code'));
  else if ((k === 'T' || k === 't') && e.shiftKey) go(nextTheme);
}, true);
/* ---------- "New Update Required": download and install a new version, with a progress bar ---------- */
Object.assign(IC, { download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>' });
const UPD = { p:null };
const mb = n => (n / 1048576).toFixed(1) + ' MB';
function renderUpdate() {
  const p = UPD.p, m = $('#updmodal'), box = $('#updbox');
  if (!p || p.state === 'dismissed') { m.classList.remove('on'); return; }
  const required = p.required !== false, later = !required && p.state !== 'ready' && p.state !== 'downloading';
  const head = (t, s) => `<div class="uicon">${ico('download')}</div><h2>${t}</h2><p class="usub">${s}</p>`;
  const laterBtn = later ? '<button class="btn g" data-upd="later">Later</button>' : '';
  let h = '';
  if (p.state === 'available') {
    h = head(required ? 'New Update Required' : 'New update available', `Claude Linux ${esc(p.version)} is ready${p.current ? ` (you have ${esc(p.current)})` : ''}.`)
      + (p.notes ? `<div class="unotes">${esc(p.notes)}</div>` : '')
      + (p.canInstall === false ? `<p class="uerr">This copy was not set up with the installer, so it cannot update itself. Run the installer again to update.</p><div class="uact"><button class="btn g" data-upd="later">Close</button></div>`
        : `<div class="uact"><button class="btn" data-upd="download">Download now</button>${laterBtn}</div>`);
  } else if (p.state === 'downloading') {
    const pct = p.total ? Math.min(100, Math.round(p.done / p.total * 100)) : 0;
    h = head('Downloading update…', `Claude Linux ${esc(p.version || '')}`) + `<div class="ubar busy"><i style="width:${p.total ? pct : 8}%"></i></div><div class="unum">${p.total ? `${pct}%  ·  ${mb(p.done)} of ${mb(p.total)}` : mb(p.done || 0)}</div><div class="uact"><button class="btn" disabled>Downloading…</button></div>`;
  } else if (p.state === 'ready') {
    h = head('Update installed', `Claude Linux ${esc(p.version)} is ready. Restart to start using it.`) + `<div class="ubar"><i style="width:100%"></i></div><div class="unum">100%</div><div class="uact"><button class="btn" data-upd="restart">Restart now</button></div>`;
  } else if (p.state === 'error') {
    h = head(required ? 'Update Required' : 'Update problem', 'The update could not be installed.') + `<p class="uerr">${esc(p.message || 'Something went wrong.')}</p><div class="uact"><button class="btn" data-upd="${p.retry === 'check' ? 'check' : 'download'}">Try again</button>${required ? '<button class="btn g" data-upd="quit">Quit</button>' : laterBtn}</div>`;
  }
  box.innerHTML = h; m.classList.add('on');
  const barEl = box.querySelector('.ubar i'); if (barEl && p.state === 'downloading' && p.total) barEl.style.width = Math.min(100, p.done / p.total * 100) + '%';
}
EXTRA.update = p => {
  if (p.state === 'current') return toast('You have the latest version (' + p.version + ')');
  if (p.state === 'disabled') return toast('Updates are not set up for this copy');
  UPD.p = { ...(p.state === 'available' ? {} : UPD.p), ...p }; renderUpdate();
};
$('#updmodal').addEventListener('click', e => {
  const b = e.target.closest('[data-upd]'); if (!b) return; const a = b.dataset.upd;
  if (a === 'download') post({type:'update_download'});
  else if (a === 'restart') post({type:'update_restart'});
  else if (a === 'check') post({type:'update_check'});
  else if (a === 'quit') post({type:'quit'});
  else if (a === 'later') { UPD.p = null; renderUpdate(); }
});
PAGE_BIND.about = b => b.querySelectorAll('[data-upd="check"]').forEach(x => x.onclick = () => post({type:'update_check'}));
setInterval(() => { renderUsage(); }, 60000);
$('#new').innerHTML = ico('plus') + 'New session'; $('#setbtn').innerHTML = ico('gear') + 'Settings';
post({type:'ready'});
