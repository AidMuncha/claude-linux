<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>Jarvis Screen</title>
<style>
html, body { margin:0; height:100%; overflow:hidden; background:transparent; }
/* the reading hologram, drawn over the real text on the screen: a blue glass strip that stretches through the words as they are spoken, then turns green and fades */
.holo { --hc:92,225,255; position:absolute; inset:0; pointer-events:none; transition:opacity .9s ease; }
.holo.done { --hc:84,240,140; }
.holo.fade { opacity:0; }
.holo i { position:absolute; border-radius:4px; mix-blend-mode:screen; transition:background-color .35s, border-color .35s, box-shadow .35s; }
.holo i.hl { background-color:rgba(var(--hc),.16); border-bottom:1px solid rgba(var(--hc),.8); box-shadow:0 0 12px rgba(var(--hc),.3); background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 3px); }
.holo i.hd { background-color:rgba(var(--hc),.34); border:1px solid rgba(var(--hc),.95); box-shadow:0 0 14px rgba(var(--hc),.85), inset 0 0 8px rgba(255,255,255,.3); animation:jvflick .14s steps(2) infinite; }
.holo.done i { animation:none; }
@keyframes jvflick { 0% { opacity:.82; } 100% { opacity:1; } }
html[data-motion=reduced] .holo i.hd, html[data-motion=reduced] #jvhead i { animation:none; }

html[data-motion=reduced] .holo i.hd { animation:none; }
</style>
</head>
<body>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC = {
  clip:'<path d="M20 12l-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>', plus:'<path d="M12 5v14M5 12h14"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  send:'<path d="M12 19V5M5 12l7-7 7 7"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>', folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  chev:'<path d="M9 6l6 6-6 6"/>', down:'<path d="M6 9l6 6 6-6"/>', check:'<path d="M5 12l5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', remote:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  cog:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>', gauge:'<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/>', doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>', code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5"/>', tool:'<path d="M14 6a4 4 0 0 0 4 4l-9 9a2.1 2.1 0 0 1-3-3z"/>',
};
const ico = (n, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24">${IC[n]}</svg>`;
const LOGO = '<svg viewBox="0 0 24 24"><path fill="#d97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>';
const LOGO_CC = LOGO.replace('fill="#d97757"', 'fill="currentColor"');
const EXTRA = {};   // handlers for messages from Python that live in other modules: EXTRA.name = payload => ...

let S = { settings:{}, usage:null, cmds:[], skills:[], files:{}, model:'', version:'', account:null, drawer:false };
const mine = new Set();
let chats = {}, cur = null, tab = 'code', home = '', st = {}, toolEls = {}, pending = 0, pt = 0, spinT = null, spinStart = {}, panel = 'general';
const post = m => window.webkit.messageHandlers.bridge.postMessage(m);
window.onerror = (msg, src, line) => post({type:'jserr', text: msg + ' @' + line});

/* ---------- the few things the main page normally provides, for Jarvis' own window ---------- */
const motionOff = () => document.documentElement.dataset.motion === 'reduced';
const toast = () => {};
window.fromPyBatch = items => { for (const [n, p] of items) { try { if (EXTRA[n]) EXTRA[n](p); } catch (e) { post({type:'jserr', text:String(e && e.stack || e)}); } } };
/* ---------- the reading hologram over the real screen (claude_linux/screenread.py drives it) ----------
   This page fills a see-through, click-through window placed over the monitor. Python sends the position of every word it found, then
   which words each spoken sentence covers and how long it lasts; a blue strip stretches through the words as they are spoken, and when he is
   done it turns green and fades. */
const SC = { words:[], items:[], finishing:false, raf:0, hls:[], hd:null, fadeT:[] };
const scHolo = document.createElement('div'); scHolo.className = 'holo'; document.body.appendChild(scHolo);
const scWeight = w => w.t.length + 1 + (/[.!?]["')\]]*$/.test(w.t) ? 6 : /[,;:]$/.test(w.t) ? 3 : 0);
function scReset() {
  SC.fadeT.forEach(clearTimeout); SC.fadeT = []; SC.items = []; SC.finishing = false; scHolo.className = 'holo'; scHolo.innerHTML = ''; SC.hls = []; SC.hd = null;
}
EXTRA.jarvis_screen = p => {
  if (p.ev === 'words') { scReset(); SC.words = p.words || []; if (!SC.raf) SC.raf = requestAnimationFrame(scFrame); }
  else if (p.ev === 'read') {
    const ws = SC.words.slice(p.a, p.b).map(scWeight), total = ws.reduce((a, b) => a + b, 0) || 1; let run = 0;
    SC.items.push({ a:p.a, b:p.b, cum:ws.map(x => (run += x) / total), start:performance.now() + (p.delay || 0) * 1000 - 15, dur:Math.max(120, (p.dur || .3) * 1000) });
  }
  else if (p.ev === 'finish') SC.finishing = true;
  else if (p.ev === 'abort' || p.ev === 'close') { scReset(); SC.words = []; }
};
function scLocate(it, now) {
  const p = Math.max(0, Math.min(1, (now - it.start) / it.dur / .96));
  let i = it.cum.findIndex(c => c >= p); if (i < 0) i = it.cum.length - 1;
  const prev = i ? it.cum[i - 1] : 0;
  return { k:it.a + i, frac:Math.max(0, Math.min(1, (p - prev) / ((it.cum[i] - prev) || 1))) };
}
function scDraw(k, frac) {
  const lines = new Map();
  for (let i = 0; i <= k && i < SC.words.length; i++) {
    const w = SC.words[i], right = i === k ? w.x + w.w * frac : w.x + w.w, l = lines.get(w.l);
    if (!l) lines.set(w.l, { l:w.x, r:right, t:w.y, h:w.h }); else { l.l = Math.min(l.l, w.x); l.r = Math.max(l.r, right); l.t = Math.min(l.t, w.y); l.h = Math.max(l.h, w.h); }
  }
  const ls = [...lines.values()];
  while (SC.hls.length < ls.length) { const e = document.createElement('i'); e.className = 'hl'; scHolo.appendChild(e); SC.hls.push(e); }
  SC.hls.forEach((e, i) => { const l = ls[i]; if (!l) { e.style.display = 'none'; return; } e.style.cssText = `left:${l.l - 3}px;top:${l.t - 2}px;width:${Math.max(4, l.r - l.l + 6)}px;height:${l.h + 4}px`; });
  const c = SC.words[Math.min(k, SC.words.length - 1)];
  if (c) { if (!SC.hd) { SC.hd = document.createElement('i'); SC.hd.className = 'hd'; scHolo.appendChild(SC.hd); } SC.hd.style.cssText = `left:${c.x - 3}px;top:${c.y - 2}px;width:${c.w + 6}px;height:${c.h + 4}px`; }
}
function scFrame(now) {
  SC.raf = requestAnimationFrame(scFrame);
  if (!SC.items.length || !SC.words.length) return;
  let pos = null;
  for (const it of SC.items) { if (now < it.start) break; pos = scLocate(it, now); }
  scDraw(pos ? pos.k : SC.items[0].a, pos ? pos.frac : 0);
  const last = SC.items[SC.items.length - 1];
  if (SC.finishing && now >= last.start + last.dur && !scHolo.classList.contains('done')) {
    scDraw(last.b - 1, 1); scHolo.classList.add('done'); SC.fadeT.push(setTimeout(() => scHolo.classList.add('fade'), 650));
  }
}
post({type:'jarvis_screen_ready'});
</script>
</body>
</html>
